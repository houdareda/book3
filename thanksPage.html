    <style>
      @font-face {
        font-family: F_Bold;
        src: local("F_Bold"), url("css/mainFont.ttf");
      }
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        direction: rtl;
      }
      body,
      html {
        font-family: F_Bold, sans-serif;
      }
      a {
        text-decoration: none;
      }
      img {
        width: 100%;
        display: block;
      }
      .div_btn {
        text-align: center;
      }
      .div_btn .btn {
        font-family: F_Bold, sans-serif;
        font-size: 24px;
        padding: 1px 38px 5px;
        line-height: 1.5;
        color: #fff;
        border-radius: 20px;
        box-shadow: 0 5px 15px #5858586b;
        cursor: pointer;
        line-height: 1;
      }
      .div_btn .btn span {
        color: #d5d5d5;
      }

      /* Start Thanks Page Section */
      body.thanks_page_page {

      }

        text-align: center;
        padding-top: 40px;
      }
      .thanks_page h1{
        color: #FFF;
        font-size: 9.5vw;
        text-align: center;
        line-height: 1.5;

      }
      .thanks_page p {
        font-size: 4vw;
        color: #fff;
   background: #F10539;
        margin: 0 auto 8px;
        padding: 5px 10px 5px;
        width: max-content;
        line-height: 1.5;
      }
            .thanks_page span{
              color: #fff;
              font-size: 4vw;
            }
      .thanks_page .text {
        position: relative;
        width: max-content;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .thanks_page .div_btn {
        margin-top: 30px;
      }
      .thanks_page .div_btn a {
  background: linear-gradient(#F10539, #b90028);
    padding: 2px 38px 2px;
    border-radius: 10px;
      }
      .thanks_page .text .img_check {
        width: 90px;
        text-align: center;
        margin: 0 auto 5px;
      }
      /* ==========  Responsive Design  ========== */
      @media (min-width: 600px) {
        body.thanks_page_page {
          background: #313131;
          min-height: 100vh;
        }
      }

      @media (min-width: 992px) {
        .thanks_page p {
          font-size: 18px;
          margin-bottom: 25px;
        }

        .thanks_page h1,
        .thanks_page h3 {
          font-size: 25px;
          margin: 0px auto 8px;
        }

        .thanks_page .text img {
          width: 100px;
        }
